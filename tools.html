        content="Advanced digital tools including Quantum Calculator, Password Generator, and Unit Converter.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="assets/images/techno.jpg" type="image/jpeg">

    <!-- Main CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <!-- Background Effects -->
    <canvas id="matrix-canvas"></canvas>
    <div class="noise-overlay"></div>

    <!-- Navigation -->
    <header class="glass-header">
        <div class="container">
            <a href="index.html" class="logo">
                <img src="assets/images/techno.jpg" alt="Logo" class="logo-icon-img">
                <span>AAYUSH</span><span style="font-weight: 300; opacity: 0.8;">TECH07</span>
            </a>
            <nav class="desktop-nav">
                <a href="index.html" class="nav-link">Home</a>
                <a href="about.html" class="nav-link">About</a>
                <a href="services.html" class="nav-link">Services</a>
                <a href="projects.html" class="nav-link">Projects</a>
                <a href="tools.html" class="nav-link active">Tools</a>
                <a href="members.html" class="nav-link">Members</a>
                <a href="contact.html" class="nav-link">Contact</a>
            </nav>
            <button class="menu-toggle">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </header>

    <!-- Tools Section -->
    <section class="section" style="padding-top: 120px;">
        <div class="container">
            <div class="section-header">
                <h2 class="section-title">Quantum Tools</h2>
                <p class="section-subtitle">Advanced utilities for the digital age.</p>
            </div>
            <div id="tools-container" class="grid-2">
                <!-- Calculator -->
                <div class="tech-card tool-card">
                    <div class="tool-header">
                        <h3><i class="fas fa-calculator"></i> Quantum Calc</h3>
                    </div>
                    <div class="calculator">
                        <input type="text" id="calc-display" readonly>
                        <div class="calc-keys">
                            <button onclick="clearCalc()" class="btn-calc operator">C</button>
                            <button onclick="appendCalc('/')" class="btn-calc operator">/</button>
                            <button onclick="appendCalc('*')" class="btn-calc operator">×</button>
                            <button onclick="deleteCalc()" class="btn-calc operator">⌫</button>
                            <button onclick="appendCalc('7')" class="btn-calc">7</button>
                            <button onclick="appendCalc('8')" class="btn-calc">8</button>
                            <button onclick="appendCalc('9')" class="btn-calc">9</button>
                            <button onclick="appendCalc('-')" class="btn-calc operator">-</button>
                            <button onclick="appendCalc('4')" class="btn-calc">4</button>
                            <button onclick="appendCalc('5')" class="btn-calc">5</button>
                            <button onclick="appendCalc('6')" class="btn-calc">6</button>
                            <button onclick="appendCalc('+')" class="btn-calc operator">+</button>
                            <button onclick="appendCalc('1')" class="btn-calc">1</button>
                            <button onclick="appendCalc('2')" class="btn-calc">2</button>
                            <button onclick="appendCalc('3')" class="btn-calc">3</button>
                            <button onclick="calculate()" class="btn-calc equals">=</button>
                            <button onclick="appendCalc('0')" class="btn-calc wide">0</button>
                            <button onclick="appendCalc('.')" class="btn-calc">.</button>
                        </div>
                    </div>
                </div>

                <!-- Password Generator -->
                <div class="tech-card tool-card">
                    <div class="tool-header">
                        <h3><i class="fas fa-key"></i> Neural Pass</h3>
                    </div>
                    <div class="password-gen">
                        <div class="pass-display">
                            <input type="text" id="pass-output" readonly placeholder="Generated Password">
                            <button onclick="copyPass()" class="btn-icon"><i class="fas fa-copy"></i></button>
                        </div>
                        <div class="pass-controls">
                            <label>Length: <span id="pass-length-val">12</span></label>
                            <input type="range" id="pass-length" min="6" max="32" value="12"
                                oninput="updatePassLength()">
                            <div class="checkbox-group">
                                <label><input type="checkbox" id="pass-upper" checked> ABC</label>
                                <label><input type="checkbox" id="pass-lower" checked> abc</label>
                                <label><input type="checkbox" id="pass-num" checked> 123</label>
                                <label><input type="checkbox" id="pass-sym" checked> #@!</label>
                            </div>
                            <button onclick="generatePass()" class="btn btn-primary full-width">Generate</button>
                        </div>
                    </div>
                </div>

                <!-- Color Picker -->
                <div class="tech-card tool-card">
                    <div class="tool-header">
                        <h3><i class="fas fa-palette"></i> Holo Color</h3>
                    </div>
                    <div class="color-picker">
                        <input type="color" id="color-input" value="#00f3ff" oninput="updateColor()">
                        <div class="color-info">
                            <div class="color-preview" id="color-preview"></div>
                            <div class="color-values">
                                <div class="value-group">
                                    <label>HEX</label>
                                    <input type="text" id="hex-val" readonly>
                                </div>
                                <div class="value-group">
                                    <label>RGB</label>
                                    <input type="text" id="rgb-val" readonly>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Unit Converter -->
                <div class="tech-card tool-card">
                    <div class="tool-header">
                        <h3><i class="fas fa-exchange-alt"></i> Unit Shift</h3>
                    </div>
                    <div class="converter">
                        <div class="converter-group">
                            <input type="number" id="conv-input" placeholder="Value" oninput="convert()">
                            <select id="conv-type" onchange="convert()">
                                <option value="m-ft">Meters to Feet</option>
                                <option value="ft-m">Feet to Meters</option>
                                <option value="kg-lb">Kg to Lbs</option>
                                <option value="lb-kg">Lbs to Kg</option>
                                <option value="c-f">Celsius to Fahrenheit</option>
                                <option value="f-c">Fahrenheit to Celsius</option>
                            </select>
                        </div>
                        <div class="converter-result">
                            <span>=</span>
                            <span id="conv-result">0</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Theme Switcher UI -->
    <div class="theme-switcher">
        <button class="theme-toggle" onclick="toggleThemePanel()">
            <i class="fas fa-cog fa-spin"></i>
        </button>
        <div class="theme-panel" id="theme-panel">
            <h3>SYSTEM THEME</h3>
            <div class="theme-options">
                <button class="theme-btn" onclick="setTheme('deep-space')"
                    style="background: #00f3ff; border-color: #00f3ff;" title="Deep Space"></button>
                <button class="theme-btn" onclick="setTheme('red-alert')"
                    style="background: #ff0000; border-color: #ff0000;" title="Red Alert"></button>
                <button class="theme-btn" onclick="setTheme('void')" style="background: #ffffff; border-color: #ffffff;"
                    title="The Void"></button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="glass-footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-brand">
                    <h3>AAYUSH-TECH07</h3>
                    <p>Innovating the digital frontier.</p>
                </div>
                <div class="footer-links">
                    <a href="https://github.com/Aayushkin" target="_blank"><i class="fab fa-github"></i></a>
                    <a href="https://linkedin.com/in/aayush-tech07" target="_blank"><i class="fab fa-linkedin"></i></a>
                    <a href="mailto:bhandariaayush07@gmail.com"><i class="fas fa-envelope"></i></a>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2025 Aayush Bhandari. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="assets/js/main.js"></script>
    <script src="assets/js/tools.js"></script>
</body>

</html>
